<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Work Log</title>
<meta name="theme-color" content="#0F1115">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Work Log">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0E1013;
    --surface: #181B22;
    --surface-2: #21252E;
    --border: rgba(255,255,255,0.07);
    --border-strong: rgba(255,255,255,0.12);
    --text: #F4F5F7;
    --text-dim: #8A8FA0;
    --text-faint: #565B68;
    --accent: #7C6BF0;
    --accent-2: #2FD9A8;
    --accent-dim: #5847C7;
    --danger: #EF5F79;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --ease: cubic-bezier(.22,.9,.32,1);
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ margin:0; padding:0; background: var(--bg); height:100%; overscroll-behavior-y: none; }
  body{
    font-family: 'Inter', sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  button{ font-family: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce){
    *{ transition-duration: 0.001ms !important; animation-duration: 0.001ms !important; }
  }

  /* App bar */
  .appbar{
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(14,16,19,0.78);
    -webkit-backdrop-filter: blur(18px);
    backdrop-filter: blur(18px);
    padding: calc(16px + var(--safe-top)) 20px 12px;
    border-bottom: 1px solid var(--border);
  }
  .appbar-top{
    display:flex;
    align-items:center;
    justify-content: space-between;
  }
  .appbar-title{
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 19px;
    letter-spacing: -0.01em;
  }
  .navgroup{ display:flex; align-items:center; gap: 6px; }
  .navbtn{
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    width: 32px; height: 32px;
    border-radius: 50%;
    font-size: 15px;
    display:flex; align-items:center; justify-content:center;
    transition: transform .12s var(--ease), background .15s;
  }
  .navbtn:active{ background: var(--surface-2); transform: scale(0.9); }
  .date-row{
    display:flex;
    align-items:baseline;
    justify-content: space-between;
    margin-top: 10px;
  }
  #dateLabel{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    color: var(--text-dim);
    letter-spacing: 0.01em;
  }
  #todayBtn{
    background: none;
    border: none;
    color: var(--accent);
    font-size: 12px;
    font-weight: 600;
    padding: 0;
    transition: opacity .15s;
  }
  #todayBtn:active{ opacity: 0.6; }

  /* Progress ring row */
  .progress-row{
    display:flex;
    align-items:center;
    gap: 16px;
    padding: 18px 20px 8px;
  }
  .ring-wrap{
    position: relative;
    width: 50px; height: 50px;
    flex: 0 0 auto;
  }
  .ring-wrap svg{ transform: rotate(-90deg); }
  .ring-bg{ fill:none; stroke: var(--surface-2); stroke-width: 4.5; }
  .ring-fg{ fill:none; stroke: url(#ringGrad); stroke-width: 4.5; stroke-linecap: round; transition: stroke-dashoffset .5s var(--ease); }
  .ring-label{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    color: var(--text);
    font-weight: 500;
  }
  .progress-text{ display:flex; flex-direction:column; gap: 2px; }
  .progress-headline{ font-size: 14.5px; font-weight: 600; letter-spacing: -0.005em; }
  .progress-sub{ font-size: 12px; color: var(--text-dim); }

  /* Carry banner */
  .carry-banner{
    margin: 12px 20px 0;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 14px;
    padding: 12px 14px;
    display: none;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    font-size: 13px;
    opacity: 0;
    transform: translateY(-4px);
    transition: opacity .25s var(--ease), transform .25s var(--ease);
  }
  .carry-banner.show{ display: flex; opacity: 1; transform: translateY(0); }
  .carry-banner button{
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 7px 12px;
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
    transition: transform .12s var(--ease), background .15s;
  }
  .carry-banner button:active{ transform: scale(0.95); background: var(--accent-dim); }

  /* Task list */
  .tasks{
    flex: 1;
    padding: 12px 16px 100px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .task-row{
    position: relative;
    overflow: hidden;
    border-radius: 14px;
  }
  .delete-zone{
    position: absolute;
    top: 0; right: 0; bottom: 0;
    width: 76px;
    background: var(--danger);
    display:flex; align-items:center; justify-content:center;
    color: #fff;
  }
  .task-content{
    position: relative;
    display:flex;
    align-items: center;
    gap: 12px;
    padding: 13px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: 0 1px 0 rgba(255,255,255,0.02) inset;
    touch-action: pan-y;
    will-change: transform;
  }
  .task-content.dragging{ transition: none; }
  .task-content.settling{ transition: transform .28s var(--ease); }
  .stamp{
    flex: 0 0 auto;
    width: 25px; height: 25px;
    border-radius: 50%;
    border: 2px solid var(--text-faint);
    background: none;
    position: relative;
    padding:0;
    transition: transform .18s var(--ease), border-color .15s, background .15s;
  }
  .stamp:active{ transform: scale(0.88); }
  .stamp.done{
    border-color: var(--accent-2);
    background: var(--accent-2);
    animation: pop .28s var(--ease);
  }
  @keyframes pop{
    0%{ transform: scale(0.7); }
    60%{ transform: scale(1.12); }
    100%{ transform: scale(1); }
  }
  .stamp svg{ position:absolute; inset:0; margin:auto; opacity:0; transition: opacity .12s; }
  .stamp.done svg{ opacity: 1; }
  .task-mid{ flex: 1 1 auto; min-width: 0; display:flex; align-items:center; gap: 8px; }
  .task-text{ font-size: 15px; min-width: 0; overflow-wrap: break-word; transition: color .2s; }
  .task-text.done{ color: var(--text-dim); text-decoration: line-through; text-decoration-color: var(--text-faint); }
  .task-time{
    flex: 0 0 auto;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    color: var(--accent);
    background: rgba(124,107,240,0.12);
    border-radius: 6px;
    padding: 2px 6px;
  }
  .empty-note{
    color: var(--text-dim);
    font-size: 13.5px;
    padding: 56px 20px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .empty-note svg{ opacity: 0.5; }

  /* Sticky add bar */
  .add-bar{
    position: sticky;
    bottom: 0;
    z-index: 10;
    background: rgba(14,16,19,0.82);
    -webkit-backdrop-filter: blur(18px);
    backdrop-filter: blur(18px);
    border-top: 1px solid var(--border);
    padding: 14px 16px calc(12px + var(--safe-bottom));
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .add-bar input[type=text]{
    flex: 1 1 auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 12px 16px;
    font-size: 15px;
    color: var(--text);
    min-width: 0;
    transition: border-color .15s;
  }
  .add-bar input[type=text]::placeholder{ color: var(--text-faint); }
  .add-bar input[type=text]:focus-visible{ border-color: var(--accent); }
  .add-bar input[type=time]{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 6px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    color: var(--text);
    width: 78px;
    flex: 0 0 auto;
    color-scheme: dark;
  }
  .add-bar button#addBtn{
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #0E1013;
    border: none;
    border-radius: 50%;
    width: 46px; height: 46px;
    flex: 0 0 auto;
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 4px 16px rgba(124,107,240,0.35);
    transition: transform .12s var(--ease);
  }
  .add-bar button#addBtn:active{ transform: scale(0.9); }

  .status-toast{
    position: fixed;
    bottom: calc(86px + var(--safe-bottom));
    left: 50%;
    transform: translateX(-50%) translateY(4px);
    background: var(--surface-2);
    border: 1px solid var(--border-strong);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    padding: 6px 14px;
    border-radius: 14px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s var(--ease), transform .25s var(--ease);
  }
  .status-toast.show{ opacity: 0.96; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
  <div class="appbar">
    <div class="appbar-top">
      <div class="appbar-title">Work Log</div>
      <div class="navgroup">
        <button class="navbtn" id="prevBtn" aria-label="Previous day">‹</button>
        <button class="navbtn" id="nextBtn" aria-label="Next day">›</button>
      </div>
    </div>
    <div class="date-row">
      <span id="dateLabel">—</span>
      <button id="todayBtn">jump to today</button>
    </div>
  </div>

  <div class="progress-row">
    <div class="ring-wrap">
      <svg width="50" height="50" viewBox="0 0 50 50">
        <defs>
          <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#7C6BF0"/>
            <stop offset="100%" stop-color="#2FD9A8"/>
          </linearGradient>
        </defs>
        <circle class="ring-bg" cx="25" cy="25" r="21"></circle>
        <circle class="ring-fg" id="ringFg" cx="25" cy="25" r="21" stroke-dasharray="131.9" stroke-dashoffset="131.9"></circle>
      </svg>
      <div class="ring-label" id="ringLabel">0%</div>
    </div>
    <div class="progress-text">
      <div class="progress-headline" id="progressHeadline">Loading…</div>
      <div class="progress-sub" id="progressSub"></div>
    </div>
  </div>

  <div class="carry-banner" id="carryBanner">
    <span id="carryText"></span>
    <button id="carryBtn">Carry over</button>
  </div>

  <div class="tasks" id="taskList"></div>

  <div class="add-bar">
    <input type="text" id="taskInput" placeholder="Add a task…" maxlength="140">
    <input type="time" id="timeInput">
    <button id="addBtn" aria-label="Add task">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M9 2V16M2 9H16" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    </button>
  </div>

  <div class="status-toast" id="statusToast">saved</div>

<script>
(function(){
  let current = new Date();
  current.setHours(0,0,0,0);
  const RING_CIRC = 131.9;
  const DELETE_THRESHOLD = -56;
  const DELETE_ZONE_W = 76;

  function fmtKey(d){
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }
  function fmtLabel(d){
    return d.toLocaleDateString(undefined, { weekday:'long', month:'short', day:'numeric' });
  }
  function isToday(d){
    const t = new Date(); t.setHours(0,0,0,0);
    return d.getTime() === t.getTime();
  }
  function uid(){
    return 't' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  }
  function easeOutCubic(t){ return 1 - Math.pow(1-t, 3); }

  const taskListEl = document.getElementById('taskList');
  const dateLabelEl = document.getElementById('dateLabel');
  const ringFg = document.getElementById('ringFg');
  const ringLabel = document.getElementById('ringLabel');
  const progressHeadline = document.getElementById('progressHeadline');
  const progressSub = document.getElementById('progressSub');
  const carryBanner = document.getElementById('carryBanner');
  const carryText = document.getElementById('carryText');
  const carryBtn = document.getElementById('carryBtn');
  const statusToast = document.getElementById('statusToast');

  const CHECK_SVG = '<svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M2.5 6.8L5.2 9.5L10.5 3.5" stroke="#0E1013" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const EMPTY_SVG = '<svg width="40" height="40" viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="17" stroke="#565B68" stroke-width="1.6"/><path d="M14 20.5L18 24.5L26 15.5" stroke="#565B68" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  let toastTimer;
  function toast(msg){
    clearTimeout(toastTimer);
    statusToast.textContent = msg;
    statusToast.classList.add('show');
    toastTimer = setTimeout(()=> statusToast.classList.remove('show'), 1100);
  }

  async function loadTasks(dateObj){
    const key = 'tasks:' + fmtKey(dateObj);
    try{
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : [];
    }catch(e){
      return [];
    }
  }
  async function saveTasks(dateObj, tasks){
    const key = 'tasks:' + fmtKey(dateObj);
    try{
      localStorage.setItem(key, JSON.stringify(tasks));
      toast('saved');
    }catch(e){
      toast('save failed');
    }
  }
  let hintShown = true;
  async function checkSwipeHint(){
    try{
      hintShown = localStorage.getItem('hint:swipeSeen') === '1';
    }catch(e){ hintShown = false; }
  }
  async function markHintShown(){
    hintShown = true;
    try{ localStorage.setItem('hint:swipeSeen', '1'); }catch(e){}
  }

  function attachSwipe(contentEl, deleteZoneEl, onDelete){
    let startX = 0, dx = 0, dragging = false;
    contentEl.addEventListener('pointerdown', (e) => {
      if(e.target.closest('.stamp')) return;
      dragging = true;
      startX = e.clientX;
      contentEl.classList.add('dragging');
      contentEl.classList.remove('settling');
      contentEl.setPointerCapture(e.pointerId);
    });
    contentEl.addEventListener('pointermove', (e) => {
      if(!dragging) return;
      dx = e.clientX - startX;
      const clamped = Math.max(Math.min(dx, 8), -(DELETE_ZONE_W + 24));
      contentEl.style.transform = `translateX(${clamped}px)`;
    });
    function release(){
      if(!dragging) return;
      dragging = false;
      contentEl.classList.remove('dragging');
      contentEl.classList.add('settling');
      if(dx < DELETE_THRESHOLD){
        contentEl.style.transform = `translateX(-100%)`;
        setTimeout(onDelete, 220);
      } else {
        contentEl.style.transform = 'translateX(0)';
      }
      dx = 0;
    }
    contentEl.addEventListener('pointerup', release);
    contentEl.addEventListener('pointercancel', release);
  }

  function render(tasks){
    dateLabelEl.textContent = fmtLabel(current) + (isToday(current) ? ' · today' : '');
    taskListEl.innerHTML = '';

    if(tasks.length === 0){
      const p = document.createElement('div');
      p.className = 'empty-note';
      p.innerHTML = EMPTY_SVG + '<span>Nothing logged yet — add what you\'re working on below.</span>';
      taskListEl.appendChild(p);
    } else {
      const sorted = [...tasks].sort((a,b) => (a.time||'99:99').localeCompare(b.time||'99:99'));
      sorted.forEach((t, idx) => {
        const row = document.createElement('div');
        row.className = 'task-row';

        const deleteZone = document.createElement('div');
        deleteZone.className = 'delete-zone';
        deleteZone.innerHTML = '<svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M3 5h12M7 5V3.5A1 1 0 018 2.5h2a1 1 0 011 1V5M6 5v9a1 1 0 001 1h4a1 1 0 001-1V5" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
        row.appendChild(deleteZone);

        const content = document.createElement('div');
        content.className = 'task-content';

        const stamp = document.createElement('button');
        stamp.className = 'stamp' + (t.done ? ' done' : '');
        stamp.innerHTML = CHECK_SVG;
        stamp.setAttribute('aria-label', t.done ? 'Mark not done' : 'Mark done');
        stamp.onclick = () => toggleTask(t.id);
        content.appendChild(stamp);

        const mid = document.createElement('div');
        mid.className = 'task-mid';
        const text = document.createElement('div');
        text.className = 'task-text' + (t.done ? ' done' : '');
        text.textContent = t.text;
        mid.appendChild(text);
        if(t.time){
          const time = document.createElement('div');
          time.className = 'task-time';
          time.textContent = t.time;
          mid.appendChild(time);
        }
        content.appendChild(mid);

        row.appendChild(content);
        taskListEl.appendChild(row);

        attachSwipe(content, deleteZone, () => deleteTask(t.id));
      });

      if(!hintShown){
        toast('Swipe a task left to delete');
        markHintShown();
      }
    }

    animateProgress(tasks);
  }

  let lastPct = 0;
  function animateProgress(tasks){
    const done = tasks.filter(t=>t.done).length;
    const total = tasks.length;
    const targetPct = total ? Math.round(done/total*100) : 0;
    const startPct = lastPct;
    const startTime = performance.now();
    const duration = 420;
    function step(now){
      const t = Math.min((now - startTime) / duration, 1);
      const eased = easeOutCubic(t);
      const pct = Math.round(startPct + (targetPct - startPct) * eased);
      ringFg.style.strokeDashoffset = RING_CIRC - (RING_CIRC * pct / 100);
      ringLabel.textContent = pct + '%';
      if(t < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
    lastPct = targetPct;

    progressHeadline.textContent = total ? `${done} of ${total} done` : 'No tasks yet';
    progressSub.textContent = total && done === total ? 'All clear for today' : (total ? `${total - done} remaining` : 'Add your first one');
  }

  let currentTasks = [];

  async function refresh(){
    progressHeadline.textContent = 'Loading…';
    progressSub.textContent = '';
    lastPct = 0;
    ringFg.style.strokeDashoffset = RING_CIRC;
    ringLabel.textContent = '0%';
    await checkSwipeHint();
    currentTasks = await loadTasks(current);
    render(currentTasks);
    await updateCarryState();
  }

  async function toggleTask(id){
    currentTasks = currentTasks.map(t => t.id === id ? {...t, done: !t.done} : t);
    render(currentTasks);
    await saveTasks(current, currentTasks);
  }
  async function deleteTask(id){
    currentTasks = currentTasks.filter(t => t.id !== id);
    render(currentTasks);
    await saveTasks(current, currentTasks);
  }
  async function addTask(){
    const input = document.getElementById('taskInput');
    const timeInput = document.getElementById('timeInput');
    const text = input.value.trim();
    if(!text) return;
    currentTasks = [...currentTasks, { id: uid(), text, time: timeInput.value || '', done: false }];
    input.value = '';
    render(currentTasks);
    await saveTasks(current, currentTasks);
  }

  async function updateCarryState(){
    const y = new Date(current);
    y.setDate(y.getDate()-1);
    const yTasks = await loadTasks(y);
    const unfinished = yTasks.filter(t => !t.done);
    if(unfinished.length){
      carryText.textContent = `${unfinished.length} unfinished from ${y.toLocaleDateString(undefined,{month:'short',day:'numeric'})}`;
      carryBanner.classList.add('show');
    } else {
      carryBanner.classList.remove('show');
    }
  }

  carryBtn.addEventListener('click', async () => {
    const y = new Date(current);
    y.setDate(y.getDate()-1);
    const yTasks = await loadTasks(y);
    const unfinished = yTasks.filter(t => !t.done);
    if(unfinished.length === 0) return;
    const carried = unfinished.map(t => ({ ...t, id: uid() }));
    currentTasks = [...currentTasks, ...carried];
    render(currentTasks);
    await saveTasks(current, currentTasks);
    carryBanner.classList.remove('show');
  });

  document.getElementById('addBtn').addEventListener('click', addTask);
  document.getElementById('taskInput').addEventListener('keydown', e => { if(e.key === 'Enter') addTask(); });

  document.getElementById('prevBtn').addEventListener('click', () => {
    current.setDate(current.getDate()-1);
    refresh();
  });
  document.getElementById('nextBtn').addEventListener('click', () => {
    current.setDate(current.getDate()+1);
    refresh();
  });
  document.getElementById('todayBtn').addEventListener('click', () => {
    current = new Date(); current.setHours(0,0,0,0);
    refresh();
  });

  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(()=>{});
    });
  }

  refresh();
})();
</script>
</body>
</html>
